#version: "3.9" se comenta ya que el warning the attribute version is obsolete es normal en Docker Compose v2. Ya no hace falta poner version:

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf

  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=admin123
      - DOCKER_INFLUXDB_INIT_ORG=weather-org
      - DOCKER_INFLUXDB_INIT_BUCKET=weather-bucket
    volumes:
      - influxdb-data:/var/lib/influxdb2

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
    volumes:
      - grafana-data:/var/lib/grafana

  publisher:
    build: ./publisher
    container_name: publisher
    depends_on:
      - mosquitto

  subscriber:
    build: ./subscriber
    container_name: subscriber
    depends_on:
      - mosquitto
      - influxdb

  node-red:
    image: nodered/node-red:latest
    container_name: node-red
    ports:
      - "1880:1880"
    volumes:
      - ./node-red-data:/data
    depends_on:
      - mosquitto
      - influxdb

volumes:
  influxdb-data:
    driver: local
  grafana-data:
    driver: local
